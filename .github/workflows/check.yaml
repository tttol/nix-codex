name: check
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: nix run nixpkgs#nixfmt-rfc-style -- --check flake.nix

  build-and-test:
    strategy:
      matrix:
        os: [macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Build package
        run: nix build -L
      - name: Check version
        run: |
          expected=$(python3 -c "import json; print(json.load(open('versions.json'))['version'])")
          actual=$(./result/bin/codex --version 2>&1 | head -1)
          echo "expected: $expected, actual: $actual"
          echo "$actual" | grep -qF "$expected"
